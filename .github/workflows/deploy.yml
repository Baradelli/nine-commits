name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A6: tsconfig.base.json deliberately excludes site/, so the components,
      # pages and layouts are statically unchecked unless `astro check` runs
      # too. It passes today, which is exactly why nobody would notice when
      # it stops.
      - run: npm run typecheck --workspace site
      - run: npm test
      # Spec §5: a malformed or leaking trace must never reach production.
      #
      # A1: REDACT_HOME_DIR tells the gate the author's real home directory.
      # `homedir()` here is /home/runner, which appears in no committed trace,
      # so without it the exact home-path rule is built out of a path nothing
      # can match. The generic home-shape rule covers the general case either
      # way, so an unset secret degrades to that rather than to nothing.
      #
      # A secret rather than a variable: the value IS one of the strings this
      # pipeline exists to keep out of a public repository, and GitHub masks
      # a secret if it ever reaches the log.
      - run: npm run validate
        env:
          REDACT_HOME_DIR: ${{ secrets.REDACT_HOME_DIR }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
